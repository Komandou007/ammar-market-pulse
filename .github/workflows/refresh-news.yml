
name: Refresh Economic News

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-economic-news-main
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch economic RSS headlines
        run: python scripts/fetch_news.py

      - name: Commit updated news
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main

            # Synchronize with the latest main while preserving
            # the generated news.json in the working directory.
            git reset --mixed origin/main

            git add news.json

            if git diff --cached --quiet; then
              echo "No news changes to commit."
              exit 0
            fi

            git commit -m "Update economic news"

            if git push origin HEAD:main; then
              echo "News update pushed successfully."
              exit 0
            fi

            echo "Push conflict on attempt ${attempt}; retrying."
            sleep 3
          done

          echo "Failed to push news after three attempts."
          exit 1
